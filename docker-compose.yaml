services:
  taverna:
    build: .
    ports:
      - "3861:3861"
    volumes:
      # Edite os dois caminhos da esquerda para apontar para a sua vault e o
      # seu config.json — taverna não usa variáveis de ambiente para isso
      # (mesmo princípio do bootstrap por arquivo único, ver INSTALL.md).
      - /caminho/absoluto/para/sua/vault:/vault:ro
      - /caminho/absoluto/para/seu/config.json:/config/config.json:ro
    command: serve
